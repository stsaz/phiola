# phiola v2.11 GUI

include_language {
	# <LANG> "lang_<LANG>.conf"
	default "lang_en.conf"
	ja "lang_ja.conf"
}

menu mfile {
	- $MFInfo		A_FILE_INFO		"I"
	- $MFShowDir	A_FILE_SHOWDIR
	- $MFRename		A_FILE_RENAME	"Shift+F6"
	- $MFDelete		A_FILE_DEL		"Shift+Delete"
	- -
	- $MFMLib		A_MLIB_SHOW		"L"
	- $MHSettings	A_SETTINGS_SHOW
	- $MFMinimizetoTray	A_TRAY_MIN	"Ctrl+M"
	- $MFExit		A_QUIT			"Ctrl+Q"
}

menu mlist_sort {
	- $MLSortFileName	A_LIST_SORT
	- $MLSortFileSize	A_LIST_SORT_FILESIZE
	- $MLSortFileDate	A_LIST_SORT_FILEDATE
	- $MLSortTagArtist	A_LIST_SORT_TAG_ARTIST
	- $MLSortTagDate	A_LIST_SORT_TAG_DATE
	- $MLShuffle		A_LIST_SHUFFLE
}

menu mlist {
	- $MLNew		A_LIST_NEW		"Ctrl+N"
	- $MLClose		A_LIST_CLOSE	"Ctrl+W"
	- $MLRename		A_LIST_RENAME
	- -
	- $MLAddFile	A_LIST_ADD_FILE	"Insert"
	- $MLAdd		A_LIST_ADD		"Ctrl+U"
	- $MLAddToNextList	A_LIST_ADDTONEXT
	- $MLFilter		A_LIST_FILTER	"Ctrl+F"
	- $MLSave		A_LIST_SAVE		"Ctrl+S"
	- $MLMetaRead	A_LIST_META_READ
	- -
	- $MLRemove		A_LIST_REMOVE	"Delete"
	- $MLRemoveNonExisting	A_LIST_REMOVE_NONEXIST
	- $MLClear		A_LIST_CLEAR
	- -
	item $MLSort {
		submenu mlist_sort
	}
	- $MLScrollToCurrent	A_LIST_SCROLL_TO_CUR
	check_item $MLAutoSelect {
		action A_LIST_AUTOSELECT
	}
}

menu mplay {
	- $MPPlayPause	A_PLAYPAUSE	"Space"
	- $MPStop		A_STOP		"S"
	- $MPNext		A_NEXT		"N"
	- $MPPrevious	A_PREV		"P"
	- -
	- $MPSeekForward	A_STEP_FWD		"Alt+Right"
	- $MPSeekBack		A_STEP_BACK		"Alt+Left"
	- $MPLeapForward	A_LEAP_FWD		"Ctrl+Right"
	- $MPLeapBack		A_LEAP_BACK		"Ctrl+Left"
	- $MPGoTo			A_GOTO_SHOW		"Ctrl+G"
	- $MPSetMarker		A_MARKER_SET	"Shift+G"
	- $MPJumpToMarker	A_MARKER_JUMP	"G"
	- -
	check_item $MPRepeat {
		action A_REPEAT_TOGGLE
	}
	check_item $MPRandom {
		action A_RANDOM_TOGGLE
	}
	- -
	- $MPVolumeUp		A_VOLUP		"Ctrl+Up"
	- $MPVolumeDown		A_VOLDOWN	"Ctrl+Down"
}

menu mrecord {
	- $MRShowRecording	A_RECORD_SHOW		"Ctrl+Shift+R"
	- $MRStartStopRec	A_RECORD_START_STOP	"Ctrl+R"
}

menu mconvert {
	- $MCConvert		A_CONVERT_SHOW		"Ctrl+T"
	- $MCSetStartPos	A_CONVERT_POS_START	"["
	- $MCSetEndPos		A_CONVERT_POS_END	"]"
}

menu mhelp {
	- $MHAbout		A_ABOUT_SHOW
}

menu mpopup {
	- $MFInfo		A_FILE_INFO
	- $MFShowDir	A_FILE_SHOWDIR
	- $MFDelete		A_FILE_DEL
	- $MLRemove		A_LIST_REMOVE
}

dialog dlg {
}

window wmain {
	title		$MNPhiola
	position	0 0 600 600
	icon {
		%IF_W32
		resource 2
		%ENDIF
		%IF_GTK
		filename "phiola.svg"
		%ENDIF
	}

	mainmenu mm {
		item $MMFile {
			submenu mfile
		}
		item $MMList {
			submenu mlist
		}
		item $MMPlayback {
			submenu mplay
		}
		item $MMRecord {
			submenu mrecord
		}
		item $MMConvert {
			submenu mconvert
		}
		item $MMHelp {
			submenu mhelp
		}
	}

	button bpause {
		style horizontal
		size 40 40
		tooltip "Play/Pause"
		action A_PLAYPAUSE
		icon {
			%IF_W32
			resource 3
			%ENDIF
			%IF_GTK
			filename "play.png"
			%ENDIF
		}
	}

	button bstop {
		style horizontal
		size 40 40
		tooltip "Stop"
		action A_STOP
		icon {
			%IF_W32
			resource 4
			%ENDIF
			%IF_GTK
			filename "stop.png"
			%ENDIF
		}
	}

	button bprev {
		style horizontal
		size 40 40
		tooltip "Previous"
		action A_PREV
		icon {
			%IF_W32
			resource 5
			%ENDIF
			%IF_GTK
			filename "prev.png"
			%ENDIF
		}
	}

	button bnext {
		style horizontal
		size 40 40
		tooltip "Next"
		action A_NEXT
		icon {
			%IF_W32
			resource 6
			%ENDIF
			%IF_GTK
			filename "next.png"
			%ENDIF
		}
	}

	label lpos {
		size 150 30
		style horizontal
		font {
			%IF_W32
			name	Arial
			%ENDIF
			height	16
			style	bold
		}
	}

	trackbar tvol {
		size 120 20
		style no_ticks both
		range 125
		value 100
		page_size 5
		scrolling A_VOL
	}

	trackbar tpos {
		style no_ticks both
		resize cx
		page_size 15
		range 0
		scroll A_SEEK
	}

	tab tabs {
		size 300 20
		resize cx
		onchange A_LIST_CHANGE
	}

	listview vlist {
		style grid_lines multi_select
		size 360 175
		resize cx cy
		double_click A_PLAY
		popup_menu mpopup

		column "#" {
			width 35
			align right
		}
		column $LCArtist {
		}
		column $LCTitle {
			width 200
		}
		column $LCDuration {
			width 50
			align right
		}
		column $LCInfo {
		}
		column $LCDate {
		}
		column $LCAlbum {
		}
		column $LCFilename {
		}
	}

	%IF_W32
	paned pntop {
		child tvol {
			move x
		}
	}
	%ENDIF

	statusbar stbar {
	}

	trayicon tray {
		lclick A_TRAY_CLICK
		icon {
			%IF_W32
			resource 2
			%ENDIF
			%IF_GTK
			filename "phiola.svg"
			%ENDIF
		}
	}
}

menu mminfo_file {
	check_item $FIMFKeepDate {
		action A_INFO_KEEPDATE
	}
	- $FIMFWriteTagsToFile	A_INFO_WRITE
}

menu mminfo_addtag {
	- $TAArtist		A_INFO_ADD_ARTIST
	- $TATitle		A_INFO_ADD_TITLE
}

window winfo {
	position	300 100 300 500
	popupfor	wmain
	mainmenu mm {
		item $FIMFile {
			submenu mminfo_file
		}
		item $FIMAddTag {
			submenu mminfo_addtag
		}
	}

	listview vinfo {
		style editable grid_lines
		size 100 100
		resize cx cy
		column $FIName {
		}
		column $FIValue {
			width 200
		}
	}
}

window wrename {
	title		$RNRenameTitle
	position	300 300 400 100
	popupfor	wmain

	editbox turl {
	}

	button brename {
		text $RNRename
		action A_RENAME_RENAME
		default 1
	}
}

window wgoto {
	title		$GTGoTo
	popupfor	wmain
	position	300 300 200 100

	editbox etime {
	}

	button bgo {
		text $GTGo
		action A_GOTO
		default 1
	}
}

window wlistadd {
	title		$LAListAdd
	position	300 300 400 100
	popupfor	wmain

	label lname {
		text $LAName
	}

	editbox turi {
	}

	button badd {
		text $LAAdd
		action A_LISTADD_ADD
		default 1
	}
}

window wlistfilter {
	title		$LFListFilter
	position	300 300 400 100
	popupfor	wmain
	on_close	A_LISTFILTER_CLOSE

	editbox tfilter {
		onchange A_LISTFILTER_SET
	}
}

window wrecord {
	position	300 100 300 300
	title		$RCRecord
	popupfor	wmain

	label ldev {
		text $RCDevice
	}
	combobox cbdev {
	}
	%IF_W32
	checkbox cbloopback {
		text	$RCLoopback
		action	A_REC_LOOPBACK
	}
	checkbox cbexcl {
		text	$RCExclusive
	}
	%ENDIF

	button bbrowse {
		text $CVOutChoose
		action A_REC_BROWSE
	}

	label ldir {
		text $CVOutDir
	}
	editbox edir {
	}

	label lname {
		text $CVOutName
	}
	editbox ename {
	}

	label lext {
		text $CVOutExt
	}
	combobox cbext {
		on_change A_REC_EXT_CHG
	}

	label lchan {
		text $RCChannels
	}
	combobox cbchan {
	}

	label l_rate {
		text $RCSampleRate
	}
	editbox e_rate {
		width	6
	}

	label laacq {
		text $CVAACQ
	}
	editbox eaacq {
		style	horizontal
		width	5
	}
	trackbar tbaacq {
		range 54
		scrolling A_CO_AACQ
	}

	label lopusq {
		text $CVOpusQ
	}
	editbox eopusq {
		style	horizontal
		width	5
	}
	trackbar tbopusq {
		range 30
		scrolling A_CO_OPUSQ
	}

	label lmp3q {
		text $CVMP3Q
	}
	editbox emp3q {
		style	horizontal
		width	5
	}
	trackbar tbmp3q {
		range 9
		scrolling A_CO_MP3Q
	}

	label lvorbisq {
		text $CVVorbisQ
	}
	editbox evorbisq {
		style	horizontal
		width	5
	}
	trackbar tbvorbisq {
		range 10
		scrolling A_CO_VORBISQ
	}

	label luntil {
		text $RCUntil
	}
	editbox euntil {
		width	10
	}

	button bstart {
		text $RCStart
		action A_RECORD_START_STOP
	}
}

window wconvert {
	position	300 100 300 300
	title		$CVConvert
	popupfor	wmain

	label ldir {
		text $CVOutDir
	}
	editbox edir {
	}

	label lname {
		text $CVOutName
	}
	editbox ename {
	}

	label lext {
		text $CVOutExt
	}
	combobox cbext {
		on_change A_CO_EXT_CHG
	}

	button bbrowse {
		text $CVOutChoose
		action A_CONVERT_BROWSE
	}

	label lfrom {
		text $CVFrom
	}
	editbox efrom {
		width	10
	}

	label luntil {
		text $CVUntil
	}
	editbox euntil {
		width	10
	}

	label ltags {
		text $CVTags
	}
	editbox etags {
	}

	checkbox cbcopy {
		text $CVCopy
		action	A_CO_COPY
	}

	label laacq {
		text $CVAACQ
	}
	editbox eaacq {
		style	horizontal
		width	5
	}
	trackbar tbaacq {
		range 54
		scrolling A_CO_AACQ
	}

	label lopusq {
		text $CVOpusQ
	}
	editbox eopusq {
		style	horizontal
		width	5
	}
	trackbar tbopusq {
		range 30
		scrolling A_CO_OPUSQ
	}

	label lmp3q {
		text $CVMP3Q
	}
	editbox emp3q {
		style	horizontal
		width	5
	}
	trackbar tbmp3q {
		range 9
		scrolling A_CO_MP3Q
	}

	label lvorbisq {
		text $CVVorbisQ
	}
	editbox evorbisq {
		style	horizontal
		width	5
	}
	trackbar tbvorbisq {
		range 10
		scrolling A_CO_VORBISQ
	}

	checkbox cbkeepdate {
		text $CVKeepDate
	}

	checkbox cboverwrite {
		text $CVOverwriteFile
	}

	button bstart {
		text $CVStart
		action A_CONVERT_START
	}
}

window wmlib {
	title		$MLTitle
	position	200 200 400 300
	popupfor	wmain

	editbox tfilter {
		onchange A_MLIB_FILTER
	}

	listview vlist {
		double_click A_MLIB_PLAY
		column $MLCPlaylist {
			width 200
		}
	}
}

window wabout {
	title		$ABAbout
	popupfor	wmain
	position	300 300 425 175

	image ico {
		%IF_W32
		size 128 128
		icon {
			resource 2
			size 128 128
		}
		%ENDIF
		%IF_GTK
		icon {
			filename "phiola.svg"
		}
		%ENDIF
	}

	label labout {
		%IF_W32
		position 130 15 300 80
		%ENDIF
	}

	label lurl {
		%IF_W32
		position 130 100 300 25
		font {
			name	Arial
			height	10
			style	underline
		}
		cursor hand
		color blue
		onclick A_ABOUT_HOMEPAGE
		%ENDIF
	}
}

window wlog {
	title		$LGLog
	position	300 100 600 200
	popupfor	wmain
	text tlog {
		resize cx cy
		%IF_W32
		font {
			name "Courier New"
			height 8
		}
		%ENDIF
	}
}

window wsettings {
	title		$STSettings
	position	300 100 300 200
	popupfor	wmain

	%IF_W32
	label ltheme {
		text $STTheme
	}
	combobox cbdarktheme {
	}
	%ENDIF

	label ldev {
		text $STPlayDev
	}
	combobox cbdev {
	}

	label lseek_by {
		text $STSeekBy
	}
	editbox eseek_by {
		width	5
	}

	label lleap_by {
		text $STLeapBy
	}
	editbox eleap_by {
		width	5
	}

	label lauto_skip {
		text $STAutoSkip
	}
	editbox eauto_skip {
		style	horizontal
		width	5
	}
	trackbar tbauto_skip {
		range 40
		scrolling A_SETS_AUTO_SKIP
	}

	label lauto_skip_tail {
		text $STAutoSkipTail
	}
	editbox eauto_skip_tail {
		style	horizontal
		width	5
	}
	trackbar tbauto_skip_tail {
		range 40
		scrolling A_SETS_AUTO_SKIP_TAIL
	}

	checkbox cbrg_norm {
		text $STRGNorm
	}
	checkbox cbauto_norm {
		text $STAutoNorm
	}

	checkbox cbeqlz {
		action	A_SETS_EQLZ
		text	$STEQ
	}

	label llibrary_dir {
		text $STMLibDirs
	}
	editbox elibrary_dir {
	}
}

window weqlz {
	title		$STEQ
	position	300 100 300 200
	popupfor	wmain

	combobox cbband {
		on_change A_EQ_CHBAND
	}

	label lfreq {
		text $STEQFreq
	}
	trackbar tbfreq {
		range 99
		resize cx
		scrolling A_EQ_FREQ
	}

	label lwidth {
		text $STEQWidth
	}
	trackbar tbwidth {
		range 40
		resize cx
		scrolling A_EQ_WIDTH
	}

	label lgain {
		text $STEQGain
	}
	trackbar tbgain {
		range 48
		resize cx
		scrolling A_EQ_GAIN
	}

	editbox eeqlz {
	}
}
